name: Main Foodgram workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.8.0
        pip install -r backend/requirements.txt
    
    - name: Lint and test
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: django_db
        DB_USER: django_user
        DB_PASSWORD: django_password
        DB_HOST: postgres
        DB_PORT: 5432
      run: |
        timeout 20s bash -c 'until pg_isready -h postgres -p 5432; do sleep 1; done; echo "DB ready"'
        python -m ruff check backend/
        cd backend
        python manage.py migrate
        python manage.py test

  frontend_tests:
    runs-on: ubuntu-latest
    needs: tests  # Добавляем зависимость от бэкенд-тестов
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
    
    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Test frontend
      run: |
        cd frontend
        npm run test

  build_and_push_backend:
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: backend
        push: true
        tags: swwwqqt/foodgram_backend:latest

  build_and_push_frontend:
    runs-on: ubuntu-latest
    needs: frontend_tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: frontend
        push: true
        tags: swwwqqt/foodgram_frontend:latest